# Overlay on memory.yml. Keep models, fusion, Top-K and QA identical to ordinary.
globals:
  schema_enabled: true
  entity_enabled: true
extractor:
  default:
    target: entity_schema
    params:
      llm: default
      schema_path: examples/entity_schema_locomo_person.json
      enable_schema_selection: true
      schema_validation_attempts: 3
evolver:
  default:
    target: schema_orchestrating
    params:
      extractor: default
      index_builder: default
      message_store: default
      dedup: default
      llm: default
entity_store:
  default:
    target: elasticsearch
    params:
      hosts: "${AML_ES_URL}"
      index: aml_lme_schema_entities_v1
      number_of_shards: 1
